<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Grid Layout</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
}

header {
    text-align: center;
    padding: 20px;
    background: #222;
}

nav {
    display: flex;
    justify-content: center;
    gap: 20px;
    background: #333;
    padding: 10px;
}

nav a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

.container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    padding: 20px;
}

.card {
    background: #222;
    border-radius: 10px;
    overflow: hidden;
    transition: transform 0.3s;
}

.card:hover {
    transform: scale(1.05);
}

.card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
}

.content {
    padding: 15px;
}

span {
    color: orange;
    font-size: 14px;
}
</style>

</head>
<body>

<header>
    <h1>🏆 CSS GRID LAYOUT</h1>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
</nav>

<div class="container">

    <div class="card">
        <img src="https://images.unsplash.com/photo-1508098682722-e99c643e7485?w=800">
        <div class="content">
            <span>⚽ FOOTBALL</span>
            <h2>GRID ITEM 1</h2>
            <p>Learn the fundamentals of CSS Grid Layout and create complex web designs.</p>
        </div>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1546519638-68e109498ffc?w=800">
        <div class="content">
            <span>🏀 BASKETBALL</span>
            <h2>GRID ITEM 2</h2>
            <p>Build responsive layouts with rows and columns.</p>
        </div>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1517649763962-0c623066013b?w=800">
        <div class="content">
            <span>🎾 TENNIS</span>
            <h2>GRID ITEM 3</h2>
            <p>Create modern websites easily using CSS Grid.</p>
        </div>
    </div>

</div>

</body>
</html>
